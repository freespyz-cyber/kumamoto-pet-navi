<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ペットと食事｜熊本ペットナビ</title><style>body{margin:0;background:#f5f2eb;color:#24312d;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;line-height:1.8}.wrap{max-width:920px;margin:auto;padding:38px 20px 60px}.brand,a{color:#234d43;font-weight:900;text-decoration:none}.eyebrow{color:#bd6d57;font-size:12px;font-weight:900;letter-spacing:.12em}.hero,.choice{background:#fffdf9;border:1px solid #dddcd5;border-radius:18px;padding:24px;margin:18px 0}.hero h1{font-size:clamp(36px,7vw,60px);line-height:1.15;margin:8px 0}.lead{color:#718078}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{margin:0}.choice h2{margin:0 0 8px;font-size:22px}.choice p{color:#718078;margin:0 0 10px}.button{display:inline-block;background:#234d43;color:#fff;border-radius:999px;padding:10px 17px}.note{background:#fff9e8;border-left:4px solid #d9b35f;padding:14px;margin-top:18px}@media(max-width:700px){.wrap{padding:28px 15px 45px}.choices{grid-template-columns:1fr}.hero,.choice{padding:20px}}</style></head><body><main class="wrap"><a class="brand" href="index.html">熊本ペットナビ</a><section class="hero"><div class="eyebrow">FOOD / PET FRIENDLY</div><h1>ペットと食事</h1><p class="lead">地域を選んで、ペットと一緒に入れるカフェ・レストランを探せます。席や犬種条件は来店前に公式情報をご確認ください。</p></section><section class="choices" aria-label="地域を選ぶ"><article class="choice"><h2>熊本のペット同伴店</h2><p>熊本市・阿蘇・天草などのお店を探します。</p><a class="button" href="pet-cafes.html">熊本のお店を見る →</a></article><article class="choice"><h2>大分のペット同伴店</h2><p>大分県の食事スポットを地域別に確認します。</p><a class="button" href="oita-pet-food.html">大分のお店を見る →</a></article><article class="choice"><h2>九州のペット同伴店</h2><p>九州各県のペット同伴スポットを探します。</p><a class="button" href="pet-cafes-regional.html">九州のお店を見る →</a></article></section><p class="note">営業日・同伴条件・席の場所は変更されることがあります。お出かけ前に公式サイトやSNSをご確認ください。</p><p><a href="index.html">← トップページへ戻る</a></p></main></body></html>
