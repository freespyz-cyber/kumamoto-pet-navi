<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ペット施設MAP｜熊本ペットナビ</title><style>body{margin:0;background:#f5f2eb;color:#24312d;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;line-height:1.8}.wrap{max-width:920px;margin:auto;padding:38px 20px 60px}.brand,a{color:#234d43;font-weight:900;text-decoration:none}.eyebrow{color:#bd6d57;font-size:12px;font-weight:900;letter-spacing:.12em}.hero,.choice{background:#fffdf9;border:1px solid #dddcd5;border-radius:18px;padding:24px;margin:18px 0}.hero h1{font-size:clamp(36px,7vw,60px);line-height:1.15;margin:8px 0}.lead,.choice p{color:#718078}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{margin:0}.choice h2{margin:0 0 8px;font-size:22px}.choice p{margin:0 0 10px}.button{display:inline-block;background:#234d43;color:#fff;border-radius:999px;padding:10px 17px}.choice.disabled{background:#f0eee8}.choice.disabled .button{background:#aeb8b1}.note{background:#fff9e8;border-left:4px solid #d9b35f;padding:14px;margin-top:18px}@media(max-width:700px){.wrap{padding:28px 15px 45px}.choices{grid-template-columns:1fr}.hero,.choice{padding:20px}}</style></head><body><main class="wrap"><a class="brand" href="index.html">熊本ペットナビ</a><section class="hero"><div class="eyebrow">MAP / PET-FRIENDLY PLACES</div><h1>ペット施設MAP</h1><p class="lead">地域を選んで、ペットと行ける場所を地図から探せます。施設情報とMapを順番に整備しています。</p></section><section class="choices" aria-label="地域を選ぶ"><article class="choice"><h2>熊本のペット施設MAP</h2><p>カフェ・ドッグラン・宿泊・動物病院を地図で確認できます。</p><a class="button" href="pet-facility-map.html">熊本のMapを見る →</a></article><article class="choice disabled"><h2>大分のペット施設MAP</h2><p>熊本版と同じ基準に整えてから公開します。</p><span class="button">準備中</span></article><article class="choice disabled"><h2>福岡のペット施設MAP</h2><p>掲載情報を確認してから公開します。</p><span class="button">準備中</span></article></section><p class="note">大分・福岡のMapは、施設情報・公式リンク・地図表示を確認後に公開します。現在は熊本のMapをご利用ください。</p><p><a href="index.html">← トップページへ戻る</a></p></main></body></html>

<script>(()=>{const c=[...document.querySelectorAll('.choice')].find(x=>x.textContent.includes('福岡のペット施設MAP'));if(!c)return;c.classList.remove('disabled');const p=c.querySelector('p');p.textContent='宿泊施設8件を掲載。熊本版と同じカテゴリで確認できます。';const s=c.querySelector('span');if(s){const a=document.createElement('a');a.className='button';a.href='fukuoka-pet-stay-map.html';a.textContent='福岡のMapを見る →';s.replaceWith(a)}const n=document.querySelector('.note');if(n)n.textContent='福岡は宿泊施設MAPを公開中です。施設情報・ペット同伴条件は予約前に公式情報をご確認ください。';})();</script>
