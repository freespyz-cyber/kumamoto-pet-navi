<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>情報・写真を教える｜熊本ペットナビ</title><style>body{margin:0;background:#f5f2eb;color:#1f2926;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;line-height:1.7}.wrap{max-width:760px;margin:auto;padding:58px 22px}.brand{color:#234d43;font-weight:900;font-size:20px}.brand small{display:block;color:#1f2926;font-size:10px;letter-spacing:.16em}h1{font-family:Georgia,"Yu Mincho",serif;font-size:clamp(36px,6vw,58px);line-height:1.15;margin:38px 0 16px}.lead{color:#718078}.panel{background:#fffdf9;border:1px solid #dddcd5;padding:28px;margin-top:28px}label{display:block;font-weight:800;margin-top:18px;font-size:14px}input,textarea,select{width:100%;padding:12px;margin-top:6px;border:1px solid #cfd4ce;background:#fff;font:inherit;box-sizing:border-box}textarea{min-height:120px}.btn{margin-top:22px;background:#234d43;color:#fff;border:0;padding:12px 20px;font-weight:800;cursor:pointer}.note{background:#fff9e8;border-left:4px solid #d9b35f;padding:14px 17px;font-size:13px;color:#66572e;margin-top:22px}.consent{font-weight:400}.back{display:inline-block;margin-top:28px;color:#234d43;font-weight:800}</style></head><body><main class="wrap"><div class="brand">熊本ペットナビ<small>KUMAMOTO PET NAVI</small></div><h1>熊本のペット情報を<br>教えてください。</h1><p class="lead">おすすめの場所、行って分かった条件、ペットとの写真、イベント情報を募集中です。</p><section class="panel"><h2>掲載候補を教える</h2><form id="submitForm"><label>投稿の種類<select name="category"><option>ペットと行ける場所</option><option>動物病院</option><option>ペットホテル・シッター</option><option>ドッグラン・遊び場</option><option>ペットショップ・用品店</option><option>ペット可物件・移動サービス</option><option>写真・体験談</option><option>施設情報の修正</option></select></label><label>エリア<select name="area"><option>熊本市</option><option>阿蘇</option><option>天草</option><option>県北</option><option>県南</option><option>熊本県内・その他</option></select></label><label>施設名・場所<input name="place" required placeholder="例：○○カフェ、阿蘇の○○公園"></label><label>知っていること<textarea name="details" placeholder="店内OK、テラスのみ、オムツ必須など"></textarea></label><label>写真（任意）<input type="file" name="photo" accept="image/*"><small>施設の許可がある写真、またはご自身で撮影した写真をお願いします。</small></label><label>公式サイト・SNS（任意）<input name="url" placeholder="https:// または Instagram URL"></label><label>連絡先（任意）<input name="contact" placeholder="メールアドレスまたはSNSアカウント"></label><label class="consent"><input type="checkbox" name="photoConsent" value="同意" required> 写真を送る場合、掲載前に確認があり、掲載後の削除依頼にも対応することを了承します。</label><button class="btn">内容を保存する</button></form><div id="status" class="note">試作版：入力内容はこのブラウザ内に保存されます。写真ファイル自体は外部送信・公開されません。正式運用では、許可確認後にサーバーへ保存します。</div></section><a class="back" href="index.html">← 熊本ペットナビのトップへ</a></main><script>document.getElementById('submitForm').addEventListener('submit',e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget));delete data.photo;data.savedAt=new Date().toISOString();const all=JSON.parse(localStorage.getItem('petNaviSubmissions')||'[]');all.push(data);localStorage.setItem('petNaviSubmissions',JSON.stringify(all));document.getElementById('status').textContent='保存しました。試作版のため、写真ファイルはまだ送信されていません。正式運用時に確認のうえ掲載します。';e.currentTarget.reset()});</script></body></html>
