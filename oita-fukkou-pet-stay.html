<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大分でペットと泊まる｜熊本ペットナビ</title><style>body{margin:0;background:#f7f4ee;color:#25332f;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;line-height:1.7}.wrap{max-width:980px;margin:auto;padding:40px 20px}.panel{background:#fffdf9;border:1px solid #e5e1d9;border-radius:18px;padding:28px;margin-bottom:20px}.lead{color:#718078}.region{border-top:1px solid #e5e1d9;padding-top:20px;margin-top:24px}.region:first-of-type{border-top:0;padding-top:0;margin-top:0}.region h3{margin:0 0 10px;color:#bd6b52;font-size:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}.card{display:block;background:#fff;color:#25332f;border:1px solid #e1ddd5;border-radius:12px;padding:14px 16px;text-decoration:none;font-weight:700;box-shadow:0 2px 8px #25332f0d}.card:hover{border-color:#234d43}.place{display:block;color:#718078;font-size:13px;font-weight:400;margin-top:3px}.back{display:inline-block;background:#234d43;color:#fff;text-decoration:none;padding:10px 16px;border-radius:999px;font-weight:700;margin-right:8px}</style></head><body><main class="wrap"><section class="panel"><p class="lead">OITA / PET FRIENDLY STAY</p><h1>大分でペットと泊まる</h1><p>大分県のペットと泊まれる宿を、地域別に探せます。予約前に各施設へ最新条件をご確認ください。</p></section><section class="panel"><h2>ペットと泊まれる宿</h2><p class="lead">地域を選んで、施設名・所在地を確認できます。</p><div id="regions"></div></section><p><a class="back" href="kyushu-fukkou-pet-stay.html">九州全体の特集へ →</a><a class="back" href="index.html">トップへ戻る</a></p></main><script>var r=[['湯布院・由布市',[['ペンションゆふいん','yufuin-pension-yufuin'],['湯布院らんぷの宿','yufuin-lamp'],['レジーナリゾート由布院','regina-yufuin'],['金門坑。','yufuin-kinmonco'],['湯布院 山荘 吾亦紅','yufuin-waremoko'],['由布院温泉 御宿 一禅','yufuin-ichizen'],['由布院グランピング 天の庭','yufuin-ten-no-niwa'],['湯富里の宿 一壷天','yufuin-ikkoten'],['由布院温泉 榎屋旅館','yufuin-enokiya'],['由布院温泉 楓の小舎','yufuin-kaede'],['由布院温泉 蓮輪INN','yufuin-hasuwa-inn'],['由平温泉 癒しの宿 鷹勝','yunohira-takasho'],['由布院オッポ','yufuin-oppo'],['グランピング九州 COMOREBI','yufuin-comorebi']]],['別府市',[['別府温泉 わんこの宿 ゆるり','beppu-wanko-yururi'],['別府 丘と海のドッグリゾート','beppu-dog-resort'],['別府のお宿 加賀屋','beppu-kagaya'],['別府温泉 ホテル好楽','beppu-koraku'],['別府駅前 ホテルはやし','beppu-hayashi']]],['九重・宝泉寺',[['貸別荘 宝泉寺温泉ログハウスA','housenji-loghouse-a'],['天空の大地 久住高原ホテル','kuju-kogen-hotel'],['宝泉寺温泉 季の郷 山の湯','housenji-yamanoyu'],['民宿水分村','kuju-mizuwake-mura'],['貸別荘 天ヶ瀬ウッディハウスG','amagase-woody-house-g'],['貸別荘 柊','amagase-hiiragi']]],['国東・豊後高田・日出',[['梅園の里','kunisaki-baien-no-sato'],['お宿 シーサイド大沢','kunisaki-seaside-oosawa'],['Sakura Beach Garden','hiji-sakura-beach-garden'],['長崎鼻ビーチリゾート','bungotakada-nagasakibana-beach']]],['日田・天ヶ瀬・豊後大野',[['里の旅リゾート ロッジきよかわ','bungoono-lodge-kiyokawa'],['旅籠 彩くら','hatago-sakura'],['愛犬と過ごす温泉旅館 HONJIN','amagase-honjin'],['バルンバルンの森','nakatsu-barunbarun']]],['中津・佐伯・その他',[['ビジネスホテル サンセイ','saiki-sansei'],['貸別荘 飯田ログハウスT','iida-loghouse-t']]]];var root=document.getElementById('regions');r.forEach(function(g){var s=document.createElement('section');s.className='region';s.innerHTML='<h3>'+g[0]+'</h3><div class="grid"></div>';var grid=s.querySelector('.grid');g[1].forEach(function(x){var a=document.createElement('a');a.className='card';a.href='oita-'+x[1]+'.html';a.innerHTML=x[0]+'<span class="place">大分県内・公式情報を確認</span>';grid.appendChild(a)});root.appendChild(s)});</script></body></html>
