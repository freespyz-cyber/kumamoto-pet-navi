<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>福岡ペット宿泊MAP｜熊本ペットナビ</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;background:#f5f2eb;color:#24312d;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}.wrap{max-width:1100px;margin:auto;padding:34px 18px}.brand,a{color:#234d43;font-weight:900;text-decoration:none}h1{font-size:clamp(30px,6vw,52px);line-height:1.2}.lead{color:#718078}.note{background:#fff9e8;border-left:4px solid #d9b35f;padding:14px 16px;margin-top:18px;font-size:13px}#map{height:65vh;min-height:430px;border-radius:16px;border:1px solid #dddcd5}</style></head><body><main class="wrap"><a class="brand" href="index.html">熊本ペットナビ</a><p>MAP / FUKUOKA PET STAYS</p><h1>福岡のペット宿泊施設を<br>地図から探す。</h1><p class="lead">犬・猫と泊まれる宿を中心に、福岡版へ掲載した施設を表示しています。</p><div id="map" aria-label="福岡県のペット宿泊施設地図"></div><div class="note">ピンの位置は地域の目安です。ペット同伴条件・営業状況は、各施設の公式情報をご確認ください。</div><p><a href="fukuoka-fukkou-pet-stay.html">← 福岡の宿泊施設一覧へ</a>　<a href="index.html">トップへ戻る</a></p></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map').setView([33.5904,130.4017],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const places=[['Stay Hakata','福岡市博多区',33.583,130.407],['ALFACIO RESORT STAY ITOSHIMA','糸島市',33.515,130.135],['風の 八女福島','八女市',33.211,130.56],['割烹旅館 まさご屋','福岡市東区・志賀島',33.68,130.305],['イヌヤド','福岡市博多区',33.57,130.42],['ritomaru rooms hakata hakozaki','福岡市東区',33.62,130.424]];places.forEach(p=>L.circleMarker([p[2],p[3]],{radius:9,color:'#fff',weight:2,fillColor:'#a67845',fillOpacity:.95}).addTo(map).bindPopup('<strong>'+p[0]+'</strong><br>'+p[1]+'<br><a href="fukuoka-fukkou-pet-stay.html">詳細を見る →</a>'));</script></body></html>
