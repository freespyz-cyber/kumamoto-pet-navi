<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>福岡ペット宿泊MAP｜熊本ペットナビ</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;background:#f5f2eb;color:#24312d;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}.wrap{max-width:1100px;margin:auto;padding:34px 18px}.brand,a{color:#234d43;font-weight:900;text-decoration:none}h1{font-size:clamp(30px,6vw,52px);line-height:1.2}.lead{color:#718078}button{border:1px solid #234d43;background:#fffdf9;color:#234d43;border-radius:99px;padding:9px 14px;font-weight:900;cursor:pointer}.note{background:#fff9e8;border-left:4px solid #d9b35f;padding:14px 16px;margin-top:18px;font-size:13px}#map{height:65vh;min-height:430px;border-radius:16px;border:1px solid #dddcd5}</style></head><body><main class="wrap"><a class="brand" href="index.html">熊本ペットナビ</a><p>MAP / FUKUOKA PET STAYS</p><h1>福岡のペット宿泊施設を<br>地図から探す。</h1><p class="lead">犬・猫と泊まれる宿を中心に、福岡版へ掲載した施設を表示しています。</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin:14px 0"><button id="use-location">現在地を出発地にする</button><button id="open-route" disabled>Googleマップでルートを見る</button><button id="clear-trip">選択をクリア</button></div><div id="trip-list" style="background:#fffdf9;padding:12px 16px;border-radius:10px;margin-bottom:14px">まだ場所が選ばれていません。</div><div id="map" aria-label="福岡県のペット宿泊施設地図"></div><div class="note">ピンの位置は地域の目安です。ペット同伴条件・営業状況は、各施設の公式情報をご確認ください。</div><p><a href="fukuoka-fukkou-pet-stay.html">← 福岡の宿泊施設一覧へ</a>　<a href="index.html">トップへ戻る</a></p></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map').setView([33.5904,130.4017],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const places=[['Stay Hakata','福岡市博多区',33.583,130.407,'#stay-hakata'],['ALFACIO RESORT STAY ITOSHIMA','糸島市',33.515,130.135,'#alfacio [4]==="食事"?"#f06a3a":(p[4]||"").includes("ドッグラン")?"#159a9c":"#7357d9",fillOpacity:.95}).addTo(map);m.bindPopup("<strong>"+p[0]+"</strong><br>"+p[1]+"<br>分類："+(p[4]||"宿泊")+(p[5]?"<br><a href=\""+p[5]+"\" target=\"_blank\" rel=\"noopener\">公式サイトを見る →</a>":"<br><a href=\"fukuoka-fukkou-pet-stay.html\">詳細を見る →</a>")+(p[6]?"<br><a href=\""+p[6]+"\" target=\"_blank\" rel=\"noopener\">公式Instagramを見る →</a>":"")+"<br><button id=\"add-trip\">この場所をルートに追加</button>");m.on("popupopen",()=>{const x=document.getElementById("add-trip");if(x)x.onclick=()=>{if(!selected.includes(p)){selected.push(p);renderTrip();x.textContent="追加済み"}}})});document.getElementById("clear-trip").onclick=()=>{selected.length=0;origin=null;renderTrip()};document.getElementById("use-location").onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(pos=>{origin=[pos.coords.latitude,pos.coords.longitude];alert("現在地を出発地に設定しました。")});routeButton.onclick=()=>{const stops=selected.map(p=>p[2]+","+p[3]);window.open(origin?"https://www.google.com/maps/dir/"+origin.join(",")+"/"+stops.join("/"):"https://www.google.com/maps/dir/"+stops.join("/"),"_blank")};</script></body></html>
<script>(()=>{const mapEl=document.getElementById('map');if(!mapEl)return;const box=document.createElement('div');box.className='fukuoka-filters';box.style='display:flex;flex-wrap:wrap;gap:8px;margin:14px 0';const cats=[['all','すべて'],['食事','ペットと食事'],['行く','ペットと行ける場所'],['宿泊','ペットと泊まる'],['預ける','ペットを預ける'],['病院','動物病院']];cats.forEach(([key,label],i)=>{const b=document.createElement('button');b.textContent=label;b.dataset.cat=key;if(i===0)b.classList.add('active');b.onclick=()=>{box.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');map.eachLayer(layer=>{if(!layer.getPopup||!layer.getPopup())return;const text=layer.getPopup().getContent();const show=key==='all'||(key==='食事'&&text.includes('分類：食事'))||(key==='行く'&&text.includes('ドッグラン'))||(key==='宿泊'&&(!text.includes('分類：食事')&&!text.includes('ドッグラン'))) ;if(show){if(!map.hasLayer(layer))layer.addTo(map)}else if(map.hasLayer(layer))map.removeLayer(layer)})};box.appendChild(b)});mapEl.parentNode.insertBefore(box,mapEl);const s=document.createElement('style');s.textContent='.fukuoka-filters button.active{background:#234d43;color:#fff}.fukuoka-filters button{border:1px solid #234d43;background:#fffdf9;color:#234d43;border-radius:99px;padding:9px 14px;font-weight:900;cursor:pointer}';document.head.appendChild(s)})();</script>
<script>(()=>{const fix=()=>{if(typeof map==='undefined')return;const buttons=[...document.querySelectorAll('.fukuoka-filters button')];const layers=Object.values(map._layers||{}).filter(x=>x.getPopup&&x.getPopup());if(!buttons.length||!layers.length)return;buttons.forEach(b=>b.onclick=()=>{buttons.forEach(x=>x.classList.remove('active'));b.classList.add('active');const key=b.dataset.cat;layers.forEach(layer=>{const text=String(layer.getPopup().getContent());const isFood=text.includes('分類：食事');const isHospital=text.includes('分類：病院');const isPlace=text.includes('ドッグラン')||text.includes('公園');const show=key==='all'||(key==='食事'&&isFood)||(key==='病院'&&isHospital)||(key==='行く'&&isPlace)||(key==='宿泊'&&!isFood&&!isPlace&&!isHospital);if(show){if(!map.hasLayer(layer))layer.addTo(map)}else if(map.hasLayer(layer))map.removeLayer(layer)})})};setTimeout(fix,300)})();</script>
<script>(()=>{const fixTiles=()=>{if(typeof map==='undefined'||typeof L==='undefined')return;map.eachLayer(layer=>{if(layer instanceof L.TileLayer)map.removeLayer(layer)});L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',{attribution:'&copy; Esri'}).addTo(map)};setTimeout(fixTiles,200)})();</script>
<script>(()=>{const recolor=()=>{if(typeof map==='undefined')return;map.eachLayer(layer=>{if(!layer.getPopup||!layer.getPopup()||!layer.setStyle)return;const t=String(layer.getPopup().getContent());const color=t.includes('分類：食事')?'#e85d75':(t.includes('ドッグラン')||t.includes('公園'))?'#159a9c':'#7357d9';layer.setStyle({fillColor:color})})};setTimeout(recolor,350)})();</script>
<script>(()=>{const style=document.createElement('style');style.textContent='.fukuoka-filters button[data-cat="食事"]::before,.fukuoka-filters button[data-cat="行く"]::before,.fukuoka-filters button[data-cat="宿泊"]::before,.fukuoka-filters button[data-cat="預ける"]::before,.fukuoka-filters button[data-cat="病院"]::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}.fukuoka-filters button[data-cat="食事"]::before{background:#e85d75}.fukuoka-filters button[data-cat="行く"]::before{background:#159a9c}.fukuoka-filters button[data-cat="宿泊"]::before{background:#7357d9}.fukuoka-filters button[data-cat="預ける"]::before{background:#c052b8}.fukuoka-filters button[data-cat="病院"]::before{background:#e5484d}';document.head.appendChild(style);const recolor=()=>{if(typeof map==='undefined')return;map.eachLayer(layer=>{if(!layer.getPopup||!layer.getPopup()||!layer.setStyle)return;const t=String(layer.getPopup().getContent());const color=t.includes('分類：食事')?'#e85d75':(t.includes('ドッグラン')||t.includes('公園'))?'#159a9c':t.includes('預ける')?'#c052b8':t.includes('病院')?'#e5484d':'#7357d9';layer.setStyle({fillColor:color})})};setTimeout(recolor,600)})();</script>
<script>(()=>{const apply=()=>{if(typeof map==='undefined')return;const active=document.querySelector('.fukuoka-filters button.active')?.dataset.cat||'all';const colors={食事:'#e85d75',行く:'#159a9c',宿泊:'#7357d9',預ける:'#c052b8',病院:'#e5484d'};map.eachLayer(layer=>{if(!layer.getPopup||!layer.getPopup()||!layer.setStyle)return;const t=String(layer.getPopup().getContent());const color=active==='all'?(t.includes('分類：食事')?'#e85d75':(t.includes('ドッグラン')||t.includes('公園'))?'#159a9c':'#7357d9'):colors[active]||'#7357d9';layer.setStyle({fillColor:color})})};setTimeout(()=>{document.querySelectorAll('.fukuoka-filters button').forEach(b=>b.addEventListener('click',()=>setTimeout(apply,20)));apply()},700)})();</script>

<script>
(() => {
  const box = document.querySelector('.fukuoka-filters');
  if (!box || box.querySelector('[data-cat="イベント"]')) return;
  const b = document.createElement('button');
  b.dataset.cat = 'イベント';
  b.textContent = 'イベント';
  b.style.setProperty('--dot', '#d9a441');
  b.onclick = () => {
    box.querySelectorAll('button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    Object.values(map._layers || {}).forEach(layer => {
      if (!layer.getPopup || !layer.getPopup()) return;
      const text = String(layer.getPopup().getContent());
      const show = text.includes('分類：イベント');
      if (show) { if (!map.hasLayer(layer)) layer.addTo(map); }
      else if (map.hasLayer(layer)) map.removeLayer(layer);
    });
  };
  box.appendChild(b);
  const s = document.createElement('style');
  s.textContent = '.fukuoka-filters button[data-cat="イベント"]::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;background:#d9a441}';
  document.head.appendChild(s);
})();
</script>

  mapEl.parentNode.insertBefore(section, mapEl.nextSibling);
  const style = document.createElement('style');
  style.textContent = '.fukuoka-food-list{margin-top:22px;padding:20px;background:#fffdf9;border:1px solid #dddcd5;border-radius:16px}.fukuoka-food-list h2{margin:0 0 6px}.fukuoka-food-list p{color:#718078}.food-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.food-card{padding:14px;border:1px solid #e5e1d9;border-radius:12px;background:#fff}.food-card strong{display:block;color:#234d43}.food-card small{display:block;color:#718078;margin-top:4px}.food-card a{display:inline-block;margin-top:8px}';
  document.head.appendChild(style);
  const render = () => {
    const cards = new Map();
    Object.values(map._layers || {}).forEach(layer => {
      const popup = layer.getPopup?.();
      if (!popup) return;
      const html = String(popup.getContent?.() || '');
      if (!html.includes('分類：食事')) return;
      const name = (html.match(/<strong>(.*?)<\/strong>/) || [,''])[1];
      if (!name || cards.has(name)) return;
      const area = (html.match(/<br>([^<]+)<br>分類：/) || [,'福岡県内'])[1];
      const href = (html.match(/href="(https?:[^" ]+)"/) || [,''])[1];
      const detail = (typeof FOOD_DETAILS !== 'undefined' && FOOD_DETAILS[name]) || 'ペット同伴条件・営業状況は来店前に公式情報をご確認ください。';
      cards.set(name, '<article class="food-card"><strong>' + name + '</strong><small>' + area + '　｜　ペットと食事</small><span>' + detail + '</span>' + (href ? '<br><a href="' + href + '" target="_blank" rel="noopener">公式情報を見る →</a>' : '') + '</article>');
    });
    section.querySelector('.food-cards').innerHTML = [...cards.values()].join('');
  };
  setTimeout(render, 900);
  setTimeout(render, 1800);
})();
</script>

<script>
(() => {
  const cleanDuplicateSections = () => {
    document.querySelectorAll('.fukuoka-hospital-list').forEach((section, index) => {
      if (index > 0) section.remove();
    });
    document.querySelectorAll('.fukuoka-food-list').forEach((section, index) => {
      if (index > 0) section.remove();
    });
    const removeDuplicateHeading = (label) => {
      const headings = [...document.querySelectorAll('h2')].filter(h => h.textContent.trim() === label);
      headings.slice(1).forEach(h => {
        const section = h.closest('section') || h.parentElement;
        if (section) section.remove();
      });
    };
    removeDuplicateHeading('福岡の動物病院');
    removeDuplicateHeading('福岡のペット同伴飲食店');
  };
  cleanDuplicateSections();
  // 複数の拡張スクリプトが非同期で一覧を追加しても、常に1つだけ残す。
  setInterval(cleanDuplicateSections, 500);
})();
</script>
