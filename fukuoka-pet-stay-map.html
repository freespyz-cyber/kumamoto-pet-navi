://www.yurinomori-m.com/animal_star_field','https://www.instagram.com/animalstarfield/'],['DOG LIFE こたびより','福津市・宮司浜',33.7810,130.4660,'食事・ドッグラン','https://www.cotabiyori.com/','https://www.instagram.com/chikuwa.taniguchi/'],['グリーンハート筑紫野','筑紫野市・杉塚',33.4870,130.5120,'トリミング・ドッグラン','https://greenheart.jp/','https://www.instagram.com/greenheart7090/'],['HUWAN（ヒューワン）','北九州市小倉北区・篠崎',33.8650,130.8720,'公園・ドッグラン','https://www.honda.co.jp/dog/travel/data/huwan-run/','https://page.line.me/qsx3766b'],];const selected=[];const tripList=document.getElementById("trip-list"),routeButton=document.getElementById("open-route");let origin=null;function renderTrip(){tripList.textContent=selected.length?selected.map((p,i)=>(i+1)+"．"+p[0]).join("　"):"まだ場所が選ばれていません。";routeButton.disabled=!selected.length}places.forEach(p=>{const m=L.circleMarker([p[2],p[3]],{radius:9,color:"#fff",weight:2,fillColor:p[4]==="食事"?"#f06a3a":p[4].includes("ドッグラン")?"#159a9c":"#7357d9",fillOpacity:.95}).addTo(map);m.bindPopup("<strong>"+p[0]+"</strong><br>"+p[1]+"<br>分類："+(p[4]||"宿泊")+(p[5]?"<br><a href=\""+p[5]+"\" target=\"_blank\" rel=\"noopener\">公式サイトを見る →</a>":"<br><a href=\"fukuoka-fukkou-pet-stay.html\">詳細を見る →</a>")+(p[6]?"<br><a href=\""+p[6]+"\" target=\"_blank\" rel=\"noopener\">公式Instagramを見る →</a>":"")+"<br><button id=\"add-trip\">この場所をルートに追加</button>");m.on("popupopen",()=>{const x=document.getElementById("add-trip");if(x)x.onclick=()=>{if(!selected.includes(p)){selected.push(p);renderTrip();x.textContent="追加済み"}}})});document.getElementById("clear-trip").onclick=()=>{selected.length=0;origin=null;renderTrip()};document.getElementById("use-location").onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(pos=>{origin=[pos.coords.latitude,pos.coords.longitude];alert("現在地を出発地に設定しました。")});routeButton.onclick=()=>{const stops=selected.map(p=>p[2]+","+p[3]);window.open(origin?"https://www.google.com/maps/dir/"+origin.join(",")+"/"+stops.join("/"):"https://www.google.com/maps/dir/"+stops.join("/"),"_blank")};</script></body></html>
