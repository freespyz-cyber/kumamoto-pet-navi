<script>(()=>{const mapEl=document.getElementById('map');if(!mapEl)return;const box=document.createElement('div');box.className='fukuoka-filters';box.style='display:flex;flex-wrap:wrap;gap:8px;margin:14px 0';const cats=[['all','すべて'],['食事','ペットと食事'],['行く','ペットと行ける場所'],['宿泊','ペットと泊まる'],['預ける','ペットを預ける'],['病院','動物病院'],['イベント','イベント']];cats.forEach(([key,label],i)=>{const b=document.createElement('button');b.textContent=label;b.dataset.cat=key;if(i===0)b.classList.add('active');b.onclick=()=>{box.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');map.eachLayer(layer=>{if(!layer.getPopup||!layer.getPopup())return;const text=layer.getPopup().getContent();const show=key==='all'||(key==='食事'&&text.includes('分類：食事'))||(key==='行く'&&text.includes('ドッグラン'))||(key==='宿泊'&&(!text.includes('分類：食事')&&!text.includes('ドッグラン'))) ;if(show){if(!map.hasLayer(layer))layer.addTo(map)}else if(map.hasLayer(layer))map.removeLayer(layer)})};box.appendChild(b)});mapEl.parentNode.insertBefore(box,mapEl);const s=document.createElement('style');s.textContent='.fukuoka-filters button.active{background:#234d43;color:#fff}.fukuoka-filters button{border:1px solid #234d43;background:#fffdf9;color:#234d43;border-radius:99px;padding:9px 14px;font-weight:900;cursor:pointer}';document.head.appendChild(s)})();</script>
<script>(()=>{const layers=()=>{const saved=window.fukuokaMarkerLayers||(window.fukuokaMarkerLayers=new Set());Object.values(map._layers||{}).filter(x=>x.getPopup?.()).forEach(x=>saved.add(x));return [...saved]};const fix=()=>{if(typeof map==='undefined')return;const buttons=[...document.querySelectorAll('.fukuoka-filters button')];if(!buttons.length)return;layers();buttons.forEach(b=>b.onclick=()=>{map.closePopup();buttons.forEach(x=>x.classList.remove('active'));b.classList.add('active');const key=b.dataset.cat;layers().forEach(layer=>{const popup=layer.getPopup?.();if(!popup)return;const text=String(popup.getContent?.()||'');const isFood=text.includes('分類：食事');const isHospital=text.includes('分類：病院');const isPlace=text.includes('ドッグラン')||text.includes('分類：公園');const isEvent=text.includes('分類：イベント');const isStay=!isFood&&!isHospital&&!isPlace&&!isEvent;const show=key==='all'||(key==='食事'&&isFood)||(key==='病院'&&isHospital)||(key==='行く'&&isPlace)||(key==='宿泊'&&isStay)||(key==='イベント'&&isEvent);if(show){if(!map.hasLayer(layer))layer.addTo(map)}else if(map.hasLayer(layer))map.removeLayer(layer)})})};fix();setTimeout(fix,300)})();</script>
<script>(()=>{const fixTiles=()=>{if(typeof map==='undefined'||typeof L==='undefined')return;map.eachLayer(layer=>{if(layer instanceof L.TileLayer)map.removeLayer(layer)});L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',{attribution:'&copy; Esri'}).addTo(map)};setTimeout(fixTiles,200)})();</script>
<script>(()=>{const recolor=()=>{if(typeof map==='undefined')return;map.eachLayer(layer=>{if(!layer.getPopup||!layer.getPopup()||!layer.setStyle)return;const t=String(layer.getPopup().getContent());const color=t.includes('分類：食事')?'#e85d75':(t.includes('ドッグラン')||t.includes('公園'))?'#159a9c':'#7357d9';layer.setStyle({fillColor:color})})};setTimeout(recolor,350)})();</script>
<script>(()=>{const style=document.createElement('style');style.textContent='.fukuoka-filters button[data-cat="食事"]::before,.fukuoka-filters button[data-cat="行く"]::before,.fukuoka-filters button[data-cat="宿泊"]::before,.fukuoka-filters button[data-cat="預ける"]::before,.fukuoka-filters button[data-cat="病院"]::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}.fukuoka-filters button[data-cat="食事"]::before{background:#e85d75}.fukuoka-filters button[data-cat="行く"]::before{background:#159a9c}.fukuoka-filters button[data-cat="宿泊"]::before{background:#7357d9}.fukuoka-filters button[data-cat="預ける"]::before{background:#c052b8}.fukuoka-filters button[data-cat="病院"]::before{background:#e5484d}';document.head.appendChild(style);const recolor=()=>{if(typeof map==='undefined')return;map.eachLayer(layer=>{if(!layer.getPopup||!layer.getPopup()||!layer.setStyle)return;const t=String(layer.getPopup().getContent());const color=t.includes('分類：食事')?'#e85d75':(t.includes('ドッグラン')||t.includes('公園'))?'#159a9c':t.includes('預ける')?'#c052b8':t.includes('病院')?'#e5484d':'#7357d9';layer.setStyle({fillColor:color})})};setTimeout(recolor,600)})();</script>

<script>
/* Always filter the current marker set. Markers are rebuilt after page load, so a
   snapshot of the original layers leaves later food markers visible. */
(() => {
  const installCategoryFilter = () => {
    if (typeof map === 'undefined') return;
    const markerLayers = window.fukuokaMarkerLayers || (window.fukuokaMarkerLayers = new Set());
    Object.values(map._layers || {}).filter(layer => layer.getPopup?.()).forEach(layer => markerLayers.add(layer));
    const buttons = [...document.querySelectorAll('.fukuoka-filters button')];
    if (!buttons.length) return;
    buttons.forEach(button => {
      button.onclick = () => {
        map.closePopup();
        buttons.forEach(item => item.classList.remove('active'));
        button.classList.add('active');
        const key = button.dataset.cat;
        Object.values(map._layers || {}).filter(layer => layer.getPopup?.()).forEach(layer => markerLayers.add(layer));
        markerLayers.forEach(layer => {
          const popup = layer.getPopup?.();
          if (!popup) return;
          const text = String(popup.getContent?.() || '');
          const isFood = text.includes('分類：食事');
          const isHospital = text.includes('分類：病院');
          const isPlace = text.includes('ドッグラン') || text.includes('分類：公園');
          const isEvent = text.includes('分類：イベント');
          const isStay = !isFood && !isHospital && !isPlace && !isEvent;
          const show = key === 'all' ||
            (key === '食事' && isFood) ||
            (key === '病院' && isHospital) ||
            (key === '行く' && isPlace) ||
            (key === '宿泊' && isStay) ||
            (key === 'イベント' && isEvent);
          if (show && !map.hasLayer(layer)) layer.addTo(map);
          if (!show && map.hasLayer(layer)) map.removeLayer(layer);
        });
      };
    });
  };
  installCategoryFilter();
  setTimeout(() => {
    window.fukuokaMarkerLayers = new Set(Object.values(map._layers || {}).filter(layer => layer.getPopup?.()));
    installCategoryFilter();
    document.querySelector('.fukuoka-filters button.active')?.click();
  }, 1400);
})();
</script>

<script>
(() => {
  const categoryColor = (html) => {
    const text = String(html || '');
    if (text.includes('分類：イベント')) return '#d9a441';
    if (text.includes('分類：病院')) return '#e5484d';
    if (text.includes('分類：食事')) return '#e85d75';
    if (text.includes('分類：預ける') || text.includes('ペットホテル')) return '#b84fc4';
    if (text.includes('ドッグラン') || text.includes('分類：公園')) return '#159a9c';
    return '#6f52d9';
  };
  const applySharedPinColors = () => {
    if (typeof map === 'undefined') return;
    Object.values(map._layers || {}).forEach(layer => {
      const popup = layer.getPopup?.();
      if (!popup || !layer.setStyle) return;
      layer.setStyle({fillColor:categoryColor(popup.getContent?.())});
    });
  };
  document.querySelectorAll('.fukuoka-filters button').forEach(button => {
    button.addEventListener('click', () => setTimeout(applySharedPinColors, 30));
  });
  applySharedPinColors();
  setTimeout(applySharedPinColors, 400);
  setTimeout(applySharedPinColors, 1000);
})();
</script>

<script>
(() => {
  const cleanDuplicateSections = () => {
    document.querySelectorAll('.fukuoka-hospital-list').forEach((section, index) => {
      if (index > 0) section.remove();
    });
    document.querySelectorAll('.fukuoka-food-list').forEach((section, index) => {
      if (index > 0) section.remove();
    });
    const removeDuplicateHeading = (label) => {
      const headings = [...document.querySelectorAll('h2')].filter(h => h.textContent.trim() === label);
      headings.slice(1).forEach(h => {
        const section = h.closest('section') || h.parentElement;
        if (section) section.remove();
      });
    };
    removeDuplicateHeading('福岡の動物病院');
    removeDuplicateHeading('福岡のペット同伴飲食店');
  };
  cleanDuplicateSections();
  // 複数の拡張スクリプトが非同期で一覧を追加しても、常に1つだけ残す。
  setInterval(cleanDuplicateSections, 500);
})();
</script>
<script>
/* Restore Fukuoka map pins that were hidden by the shared-link filter:
   original entries with an explicit source URL, plus three address/coordinate-
   verified additions. Do not revive unverified food candidates. */
(() => {
  if (typeof map === 'undefined' || typeof places === 'undefined' || typeof hospitals === 'undefined') return;
  const registry = window.fukuokaMarkerLayers || (window.fukuokaMarkerLayers = new Set());
  const names = new Set();
  Object.values(map._layers || {}).forEach(layer => {
    const html = String(layer.getPopup?.()?.getContent?.() || '');
    const name = (html.match(/<strong>(.*?)<\/strong>/) || [, ''])[1].trim();
    if (name) { names.add(name); registry.add(layer); }
  });
  const verifiedFoodNames = new Set(['パタゴニアの南', 'ドッグキャンパーレスト青柳', 'ドッグキャンパーレスト小笠木', 'ながかわ']);
  const add = (p) => {
    if (names.has(p[0]) || !Number.isFinite(p[2]) || !Number.isFinite(p[3])) return;
    const rawCategory = String(p[4] || '宿泊');
    const category = rawCategory.startsWith('#') ? '宿泊' : rawCategory;
    const color = category.includes('ドッグラン') ? '#159a9c' : category.includes('食事') ? '#e85d75' : '#7357d9';
    const marker = L.circleMarker([p[2], p[3]], {radius:9, color:'#fff', weight:2, fillColor:color, fillOpacity:.95}).addTo(map);
    const link = p[5] && /^https?:\/\//.test(p[5]) ? '<br><a href="' + p[5] + '" target="_blank" rel="noopener">公式サイトを見る →</a>' : '<br><a href="fukuoka-fukkou-pet-stay.html">詳細を見る →</a>';
    marker.bindPopup('<strong>' + p[0] + '</strong><br>' + p[1] + '<br>分類：' + category + link);
    names.add(p[0]);
    registry.add(marker);
  };
  places.filter(p => (verifiedFoodNames.has(p[0]) || (typeof p[5] === 'string' && p[5].startsWith('http')))).forEach(add);
})();
</script>
