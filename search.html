div></div></main><script>const pages=[['ペット同伴カフェ・食事','pet-cafes.html',['カフェ','食事','ランチ','犬連れ','犬同伴']],['市外のペット同伴カフェ','pet-cafes-regional.html',['阿蘇','南阿蘇','天草','カフェ','犬連れ']],['夜間・休日動物病院','night-vets.html',['病院','夜間','休日','救急']],['ドッグラン・犬の遊び場','dog-run-candidates.html',['ドッグラン','遊び','犬','犬連れ']],['ペットホテル・一時預かり','pet-hotels.html',['ホテル','預かり','泊まる']],['ペットショップ・譲渡先','pet-shops.html',['ショップ','譲渡','迎える']],['ペット用品・フードを買う場所','pet-supplies.html',['用品','フード','買い物','ホームセンター']],['ペットと住める賃貸','pet-friendly-housing.html',['住まい','賃貸','アパート']],['ペットと行く熊本モデルコース','pet-travel-plans.html',['旅行','観光','モデルコース','お出かけ']],['ペットタクシー・送迎','pet-taxi-list.html',['移動','タクシー','送迎']],['猫との暮らし','cat-life.html',['猫']],['小動物・鳥・爬虫類','small-pets.html',['小動物','鳥','爬虫類']],['犬のしつけ・相談','pet-training.html',['しつけ','相談']]];function show(){const q=document.getElementById('q').value.trim().toLowerCase();const out=document.getElementById('result');if(!q){out.innerHTML='<p>検索したい言葉を入力してください。</p>';return}const hits=pages.filter(p=>p[0].toLowerCase().includes(q)||p[2].some(k=>k.includes(q)||q.includes(k)));out.innerHTML=hits.length?'<h2>検索結果</h2>'+hits.map(p=>`<a href="${p[1]}">${p[0]}　→</a>`).join(''):'<p>近い情報が見つかりませんでした。<br>「カフェ」「病院」「阿蘇」など、短い言葉でもお試しください。</p>'}document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();show();history.replaceState(null,'','?q='+encodeURIComponent(document.getElementById('q').value))});const initial=new URLSearchParams(location.search).get('q')||'';document.getElementById('q').value=initial;if(initial)show();</script></body></html>
