<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ペット保険の選び方チェックリスト｜熊本ペットナビ</title><meta name="description" content="犬や猫のペット保険を検討するときに確認したい、補償範囲・免責・更新・待機期間などのポイントを整理します。"><style>body{margin:0;background:#f5f2eb;color:#24312d;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;line-height:1.8}.wrap{max-width:820px;margin:auto;padding:46px 22px}.brand,a{color:#234d43;font-weight:900;text-decoration:none}.eyebrow{margin-top:52px;color:#bd6d57;font-size:12px;font-weight:900;letter-spacing:.12em}.hero h1{font-family:Georgia,"Yu Mincho",serif;font-size:clamp(34px,6vw,56px);line-height:1.15}.lead{color:#718078}.box{background:#fffdf9;border:1px solid #dddcd5;padding:22px;margin:18px 0;border-radius:12px}.box h2{margin-top:0}.check{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid #eee}.check input{width:20px;height:20px;accent-color:#234d43}.note{background:#fff9e8;border-left:4px solid #d9b35f;padding:16px;margin:24px 0;font-size:14px}</style></head><body><main class="wrap"><a class="brand" href="index.html">熊本ペットナビ</a><div class="eyebrow">PET INSURANCE GUIDE</div><section class="hero"><h1>もしもの通院に、<br>備えを考える。</h1><p class="lead">ペット保険は商品ごとに条件が違います。加入前に確認したい項目をまとめました。</p></section><div class="box"><h2>補償の範囲</h2><label class="check"><input type="checkbox">通院・入院・手術のどこまで対象か</label><label class="check"><input type="checkbox">免責金額・自己負担割合</label><label class="check"><input type="checkbox">年間限度額・回数・1回あたり上限</label><label class="check"><input type="checkbox">先天性疾患・既往症・予防目的の扱い</label></div><div class="box"><h2>契約条件</h2><label class="check"><input type="checkbox">待機期間の有無</label><label class="check"><input type="checkbox">年齢制限と更新条件</label><label class="check"><input type="checkbox">保険料が変わるタイミング</label><label class="check"><input type="checkbox">解約・継続・更新時の条件</label></div><div class="box"><h2>使いやすさ</h2><label class="check"><input type="checkbox">対応する動物病院や請求方法</label><label class="check"><input type="checkbox">診断書・領収書など必要書類</label><label class="check"><input type="checkbox">かかりつけ病院で相談できるか</label></div><div class="note"><strong>大切なこと：</strong>保険料だけで決めず、約款・重要事項説明書を確認してください。持病や治療中の症状がある場合は、加入条件を正確に申告しましょう。</div><p><a href="pet-insurance.html">ペット保険の基本へ →</a>　<a href="vets.html">動物病院ガイドを見る →</a></p></main></body></html>
