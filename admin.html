<!doctype html>
<html lang="ja">
<head><script async src="https://www.googletagmanager.com/gtag/js?id=G-2BFDPBF4EE"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag("js",new Date());gtag("config","G-2BFDPBF4EE");</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>投稿管理｜熊本ペットナビ</title><meta name="description" content="投稿管理｜熊本ペットナビ。熊本のペット情報を分かりやすく紹介します。">
  <style>
    :root{--green:#234d43;--paper:#f5f2eb;--panel:#fffdf9;--ink:#1f2926;--muted:#68776f;--line:#d8ddd7;--coral:#c95f49;--new:#a86816;--done:#357056}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.65}
    a{color:var(--green)}
    .wrap{max-width:1080px;margin:auto;padding:34px 18px 70px}
    .top{display:flex;gap:20px;align-items:flex-start;justify-content:space-between}
    .eyebrow{margin:0;color:var(--green);font-size:12px;font-weight:900;letter-spacing:.14em}
    h1{margin:4px 0 6px;font-family:Georgia,"Yu Mincho",serif;font-size:clamp(30px,5vw,48px);line-height:1.2}
    .intro{margin:0;color:var(--muted)}
    .signout{white-space:nowrap;font-size:13px;font-weight:800}
    .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:28px 0 16px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
    .filter{display:grid;gap:5px;min-width:180px;color:var(--muted);font-size:12px;font-weight:800}
    select,button{min-height:42px;border:1px solid #c8d0ca;border-radius:9px;background:#fff;color:var(--ink);font:inherit}
    select{padding:8px 36px 8px 11px}
    button{padding:8px 14px;font-weight:900;cursor:pointer}
    button:hover{border-color:var(--green)}
    button:disabled{opacity:.55;cursor:wait}
    .refresh{background:var(--green);border-color:var(--green);color:#fff}
    .summary{margin-left:auto;color:var(--muted);font-size:14px;font-weight:800}
    .status{margin:14px 0;padding:12px 14px;border-left:4px solid #d9b35f;border-radius:4px;background:#fff9e8;color:#66572e;font-size:13px}
    .status[data-state="error"]{border-color:var(--coral);background:#fff0ec;color:#853827}
    .status[data-state="success"]{border-color:var(--done);background:#edf8f1;color:#24553f}
    .list{display:grid;gap:14px}
    .card{padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:0 10px 28px rgba(35,77,67,.045)}
    .card-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
    .place{margin:0;font-size:20px;line-height:1.4;overflow-wrap:anywhere}
    .meta{margin:5px 0 0;color:var(--muted);font-size:13px}
    .badge{display:inline-flex;align-items:center;white-space:nowrap;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:900}
    .badge.new{background:#fff2d8;color:var(--new)}
    .badge.done{background:#e7f4eb;color:var(--done)}
    .details{margin:18px 0 0;padding:13px 15px;border-radius:10px;background:#f7f7f2;white-space:pre-wrap;overflow-wrap:anywhere}
    .fields{display:grid;grid-template-columns:110px minmax(0,1fr);gap:7px 14px;margin:17px 0 0;font-size:14px}
    .fields dt{color:var(--muted);font-weight:800}
    .fields dd{margin:0;overflow-wrap:anywhere}
    .fields a{word-break:break-all}
    .actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
    .toggle{background:var(--green);border-color:var(--green);color:#fff}
    .delete{margin-left:auto;color:#a33d2c;border-color:#e4b4a9;background:#fff7f4}
    .empty{padding:45px 20px;text-align:center;background:var(--panel);border:1px dashed #bec8c0;border-radius:15px;color:var(--muted)}
    @media (max-width:620px){.top{display:block}.signout{display:inline-block;margin-top:10px}.toolbar{align-items:stretch}.filter{width:100%}.summary{width:100%;margin:4px 0 0}.card{padding:17px}.card-head{display:block}.badge{margin-top:8px}.fields{grid-template-columns:1fr;gap:2px}.fields dd{margin-bottom:9px}.delete{margin-left:0}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div>
        <p class="eyebrow">KUMAMOTO PET NAVI</p>
        <h1>投稿管理</h1>
        <p class="intro">届いた情報と写真を確認し、対応状況を管理できます。</p>
      </div>
      <a class="signout" href="/signout-with-chatgpt?return_to=/">ログアウト</a>
    </header>

    <section class="toolbar" aria-label="表示条件">
      <label class="filter" for="statusFilter">表示する投稿
        <select id="statusFilter">
          <option value="all">すべて</option>
          <option value="new">未対応</option>
          <option value="done">対応済み</option>
        </select>
      </label>
      <button class="refresh" id="refreshButton" type="button">更新する</button>
      <div class="summary" id="summary">読み込み中…</div>
    </section>

    <div class="status" id="status" role="status" aria-live="polite">投稿を読み込んでいます。</div>
    <section class="list" id="submissionList" aria-label="投稿一覧"></section>
  </main>

  <script>
    const list = document.getElementById("submissionList");
    const filter = document.getElementById("statusFilter");
    const refreshButton = document.getElementById("refreshButton");
    const summary = document.getElementById("summary");
    const statusBox = document.getElementById("status");

    function setStatus(message, state) {
      statusBox.textContent = message;
      statusBox.dataset.state = state || "";
    }

    function formatDate(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value || "日時不明";
      return new Intl.DateTimeFormat("ja-JP", {
        timeZone: "Asia/Tokyo",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      }).format(date);
    }

    function addField(container, label, value, link) {
      if (!value) return;
      const term = document.createElement("dt");
      term.textContent = label;
      const detail = document.createElement("dd");
      if (link) {
        const anchor = document.createElement("a");
        anchor.href = link;
        anchor.textContent = value;
        anchor.target = "_blank";
        anchor.rel = "noopener noreferrer";
        detail.append(anchor);
      } else {
        detail.textContent = value;
      }
      container.append(term, detail);
    }

    function safeWebUrl(value) {
      try {
        const url = new URL(value);
        return url.protocol === "https:" || url.protocol === "http:" ? url.href : "";
      } catch {
        return "";
      }
    }

    async function apiRequest(url, options) {
      const response = await fetch(url, {
        ...options,
        headers: { Accept: "application/json", ...(options && options.headers) },
      });
      const data = await response.json().catch(() => ({}));
      if (response.status === 401) {
        window.location.href = "/signin-with-chatgpt?return_to=/admin";
        throw new Error("再ログインしています。");
      }
      if (!response.ok || !data.ok) throw new Error(data.error || "操作できませんでした。");
      return data;
    }

    function buildCard(item) {
      const card = document.createElement("article");
      card.className = "card";

      const head = document.createElement("div");
      head.className = "card-head";
      const titleGroup = document.createElement("div");
      const title = document.createElement("h2");
      title.className = "place";
      title.textContent = item.place || "名称未入力";
      const meta = document.createElement("p");
      meta.className = "meta";
      meta.textContent = formatDate(item.created_at) + " ／ " + (item.category || "種類不明") + " ／ " + (item.area || "地域不明");
      titleGroup.append(title, meta);
      const badge = document.createElement("span");
      badge.className = "badge " + (item.status === "done" ? "done" : "new");
      badge.textContent = item.status === "done" ? "対応済み" : "未対応";
      head.append(titleGroup, badge);
      card.append(head);

      if (item.details) {
        const details = document.createElement("p");
        details.className = "details";
        details.textContent = item.details;
        card.append(details);
      }

      const fields = document.createElement("dl");
      fields.className = "fields";
      const officialUrl = safeWebUrl(item.url || "");
      addField(fields, "公式サイト・SNS", item.url, officialUrl);
      addField(fields, "連絡先", item.contact);
      if (item.photo_name) {
        addField(fields, "写真", item.photo_name, "/api/admin/submissions/" + encodeURIComponent(item.id) + "/photo");
      }
      if (fields.childElementCount) card.append(fields);

      const actions = document.createElement("div");
      actions.className = "actions";
      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "toggle";
      const nextStatus = item.status === "done" ? "new" : "done";
      toggle.textContent = item.status === "done" ? "未対応に戻す" : "対応済みにする";
      toggle.addEventListener("click", async () => {
        toggle.disabled = true;
        try {
          await apiRequest("/api/admin/submissions/" + encodeURIComponent(item.id), {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status: nextStatus }),
          });
          setStatus("対応状況を更新しました。", "success");
          await loadSubmissions();
        } catch (error) {
          setStatus(error.message, "error");
          toggle.disabled = false;
        }
      });

      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "delete";
      remove.textContent = "削除する";
      remove.addEventListener("click", async () => {
        if (!window.confirm("「" + (item.place || "この投稿") + "」を削除しますか？ 写真も削除され、元に戻せません。")) return;
        remove.disabled = true;
        try {
          await apiRequest("/api/admin/submissions/" + encodeURIComponent(item.id), { method: "DELETE" });
          setStatus("投稿を削除しました。", "success");
          await loadSubmissions();
        } catch (error) {
          setStatus(error.message, "error");
          remove.disabled = false;
        }
      });
      actions.append(toggle, remove);
      card.append(actions);
      return card;
    }

    async function loadSubmissions() {
      refreshButton.disabled = true;
      setStatus("投稿を読み込んでいます。", "");
      try {
        const selected = filter.value;
        const query = selected === "all" ? "" : "?status=" + encodeURIComponent(selected);
        const data = await apiRequest("/api/admin/submissions" + query);
        const submissions = Array.isArray(data.submissions) ? data.submissions : [];
        list.replaceChildren();
        submissions.forEach((item) => list.append(buildCard(item)));
        if (!submissions.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = selected === "all" ? "投稿はまだありません。" : "この状態の投稿はありません。";
          list.append(empty);
        }
        summary.textContent = submissions.length + "件表示";
        setStatus("最新の投稿を表示しています。", "success");
      } catch (error) {
        summary.textContent = "読み込み失敗";
        setStatus(error.message || "投稿を読み込めませんでした。", "error");
      } finally {
        refreshButton.disabled = false;
      }
    }

    filter.addEventListener("change", loadSubmissions);
    refreshButton.addEventListener("click", loadSubmissions);
    loadSubmissions();
  </script>
</body>
</html>
