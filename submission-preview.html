<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投稿内容の確認｜熊本ペットナビ</title><style>body{margin:0;background:#f5f2eb;color:#24312d;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}.wrap{max-width:820px;margin:auto;padding:48px 22px}.brand{color:#234d43;font-weight:900;text-decoration:none}.panel{background:#fffdf9;border:1px solid #dddcd5;padding:22px;margin-top:28px}.item{border-bottom:1px solid #dddcd5;padding:15px 0}.item:last-child{border:0}.muted{color:#718078;font-size:13px}.btn{border:0;background:#bd6d57;color:#fff;padding:10px 14px;font-weight:900}</style></head><body><main class="wrap"><a class="brand" href="index.html">熊本ペットナビ</a><h1>保存した投稿を確認</h1><p class="muted">このブラウザ内に保存された試作データだけを表示します。</p><section class="panel"><div id="list"></div><button class="btn" id="clear">このブラウザの保存データを消去</button></section><p><a href="submit.html" style="color:#234d43;font-weight:900">← 投稿フォームへ</a></p></main><script>const list=document.getElementById('list');function render(){const data=JSON.parse(localStorage.getItem('petNaviSubmissions')||'[]');list.innerHTML=data.length?data.map((x,i)=>`<div class="item"><strong>${i+1}. ${x.place}</strong><div>${x.category}｜${x.area}</div><div>${x.details||'詳細なし'}</div><div class="muted">${x.url||''}</div></div>`).join(''):'<p>保存された投稿はありません。</p>'}document.getElementById('clear').onclick=()=>{localStorage.removeItem('petNaviSubmissions');render()};render();</script></body></html>
