<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大分のペット同伴食事スポットMAP｜熊本ペットナビ</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;background:#f7f4ee;color:#25332f;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif}.wrap{max-width:1100px;margin:auto;padding:30px 18px}.hero,.panel{background:#fffdf9;border:1px solid #e5e1d9;border-radius:18px;padding:24px;margin-bottom:18px}a{color:#234d43;font-weight:900;text-decoration:none}h1{font-size:clamp(32px,6vw,56px);line-height:1.15}.lead,.count{color:#718078}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.filters button{border:1px solid #d8e0da;border-radius:999px;background:#fff;padding:10px 14px;color:#234d43;font-weight:800;cursor:pointer}.filters button.active{background:#234d43;color:#fff}#map{height:64vh;min-height:480px;border-radius:16px;border:1px solid #dddcd5}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:16px}.card{display:block;background:#fff;border:1px solid #e5e1d9;border-radius:12px;padding:14px}.card strong{display:block;color:#234d43}.card small{color:#718078}.note{background:#fff8e5;border-left:4px solid #d9b35f;padding:12px 15px}</style></head><body><main class="wrap"><a href="oita-pet-food.html">← 大分の食事スポット一覧へ戻る</a><section class="hero"><h1>大分のペット同伴<br>食事スポットMAP</h1><p class="lead">掲載中の店舗を地図から探せます。</p><p class="note">位置は掲載地域を基準にした目安です。来店前に公式情報をご確認ください。</p></section><section class="panel"><div class="filters"><button class="active" data-area="all">すべて</button><button data-area="beppu">別府</button><button data-area="yufuin">由布・湯布院</button><button data-area="oita">大分</button><button data-area="other">その他</button></div><p class="count" id="count"></p><div id="map"></div></section><section class="panel"><h2>掲載店舗一覧</h2><div class="cards" id="list"></div></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const groups={beppu:['別府市','別府湾SA'],yufuin:['由布市','由布院'],oita:['大分市']};const places=[['食事処 春日','九重町',33.23,131.18],['Cafe BoiBoi','竹田市',33.06,131.27],['檪の丘','由布市・湯布院',33.25,131.32],['カフェ flap fly','大分市',33.24,131.61],['Pizza Buono','豊後大野市',32.97,131.58],['ゆふいんバーガーハウス','由布市・湯布院',33.26,131.36],['榎屋茶房','由布市・湯布院',33.26,131.36],['MOG me','別府市',33.28,131.50],['おおがファーム','日出町',33.37,131.53],['長崎鼻ビーチリゾート','豊後高田市',33.60,131.55],['カフェカプリセス','竹田市',32.97,131.40],['J-tapas','由布院',33.26,131.36],['久住ワイナリー 石窯工房','竹田市',33.07,131.25],['和洋居酒屋MIYA','大分市',33.24,131.61],['とまり木','日田市',33.32,130.94],['B&Bレストラン ムジカ','宇佐市安心院町',33.44,131.35],['茶房ありす','別府市・鉄輪',33.31,131.47],['森藩別邸','別府市',33.28,131.50],['Open caffe 桜','津久見市',33.07,131.86],['アルテジオダイニング','別府湾SA',33.31,131.54],['LA LUCE 80℃','大分市',33.22,131.65],['ワンLOVE','大分市',33.22,131.66],['レストラン キジョウカク','臼杵市',33.13,131.80],['B-speak cafe','別府湾SA',33.31,131.54],['地熱観光ラボ縁間','別府市・鉄輪',33.31,131.47],['SORAカフェ','宇佐市安心院',33.44,131.35],['Gypsy’s Smile','竹田市',33.08,131.34],['茶房 長屋門','臼杵市',33.12,131.80],['森のレストランRyuo','佐伯市',32.80,131.62],['ばんぢろ','大分市',33.24,131.61],['九丁目の八ちょう目','別府市',33.28,131.50],['cafe TAKEYA','別府市',33.28,131.50],['碧の時間','別府市',33.28,131.47],['CAFE&KITCHEN 結','杵築市',33.42,131.62],['coffee 5','佐伯市',32.96,131.90],['I’m home bar Laff＋','大分市',33.24,131.61],['キャラバンコーヒー由布院館','由布市・湯布院',33.26,131.36],['CREOLE CAFE','別府市',33.28,131.50],['あまべの郷 関あじ関さば館','大分市',33.24,131.88],['nando H.W.L','大分市',33.24,131.61],['茶房 風曜日','由布市・湯布院',33.27,131.35],['ドッグラン＆カフェ Green Field','由布市・湯布院',33.25,131.32],['ドッグカフェ KURU・SAN','別府市',33.33,131.48],['Cherie Storage Cafe','別府市',33.29,131.50]];const area=p=>Object.keys(groups).find(k=>groups[k].some(x=>p[1].includes(x)))||'other';const map=L.map('map').setView([33.25,131.45],9);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri'}).addTo(map);let markers=[];function render(a='all'){markers.forEach(m=>m.remove());const f=places.filter(p=>a==='all'||area(p)===a);markers=f.map(p=>L.circleMarker([p[2],p[3]],{radius:8,color:'#fff',weight:2,fillColor:'#e06b4d',fillOpacity:.95}).addTo(map).bindPopup('<strong>'+p[0]+'</strong><br>'+p[1]+'<br><a href="oita-pet-food.html">一覧で詳細を見る →</a>'));document.getElementById('count').textContent=f.length+'件を表示中';document.getElementById('list').innerHTML=f.map(p=>'<a class="card" href="oita-pet-food.html"><strong>'+p[0]+'</strong><small>'+p[1]+'　一覧で詳細を見る →</small></a>').join('')}document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.area)});render();</script></body></html>
